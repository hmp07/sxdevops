services:
  sxdevops:
    build:
      context: .
      dockerfile: Dockerfile
    image: sxdevops:latest
    container_name: sxdevops-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      DATABASE_ENGINE: mysql
      MYSQL_HOST: mysql
      MYSQL_PORT: "3306"
      MYSQL_DATABASE: sxdevops
      MYSQL_USER: sxdevops
      MYSQL_PASSWORD: sxdevops_password
      REDIS_URL: redis://redis:6379/0
      CHANNEL_REDIS_URL: redis://redis:6379/1
      # 生产部署必填：docker compose 时通过 .env 或 -e 注入随机值，缺失则容器启动即报错
      SECRET_KEY: ${SECRET_KEY:?SECRET_KEY is required - generate with "openssl rand -base64 48"}
      # 凭据加密专用密钥（可选；未设置时自动由 SECRET_KEY 派生）
      SXDEVOPS_CREDENTIAL_KEY: ${SXDEVOPS_CREDENTIAL_KEY:-}
      DEBUG: "0"
      # 允许访问的主机名/IP（逗号分隔）：必填，按实际访问地址配置（Host 头防护，不允许 * 兜底）
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required - set to your actual domain/IP in .env}
      CORS_ALLOW_ALL_ORIGINS: "0"
      # 管理员口令：.env 注入（必填，缺失则启动报错；每次启动由 ensure_admin 自动建号/加固）
      SXDEVOPS_ADMIN_PASSWORD: ${SXDEVOPS_ADMIN_PASSWORD:?SXDEVOPS_ADMIN_PASSWORD is required - set it in .env}
      SXDEVOPS_WAIT_FOR_DB: "1"
      SXDEVOPS_MIGRATE: "1"
      # 演示种子默认关闭；需要演示数据时显式置 1（含演示账号与示例数据源）
      SXDEVOPS_SEED_DATA: ${SXDEVOPS_SEED_DATA:-0}
      # Zabbix 告警混合接入：webhook 推送为主，内置轮询为小时级兜底（整点对齐）
      SXDEVOPS_ZABBIX_POLL_INTERVAL: ${SXDEVOPS_ZABBIX_POLL_INTERVAL:-3600}
      # 告警 AI 自动分析全局默认阈值（接入源级配置优先）
      SXDEVOPS_ALERT_ANALYSIS_MIN_SEVERITY: ${SXDEVOPS_ALERT_ANALYSIS_MIN_SEVERITY:-warning}
      # 智能体/任务模板是平台功能数据（非演示数据），保留默认开启
      SXDEVOPS_SEED_TEMPLATES: ${SXDEVOPS_SEED_TEMPLATES:-1}
    ports:
      - "8000:8000"

  mysql:
    image: mysql:8.0
    container_name: sxdevops-mysql
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      # 排序缓冲 4MB：filesort 整行入缓冲时防止大 JSON 行撑爆默认 256KB（1038 Out of sort memory）
      - --sort_buffer_size=4194304
      # 认证插件使用 MySQL 8.0 默认的 caching_sha2_password（mysql_native_password 已弃用）
    environment:
      MYSQL_DATABASE: sxdevops
      MYSQL_USER: sxdevops
      MYSQL_PASSWORD: sxdevops_password
      MYSQL_ROOT_PASSWORD: sxdevops_root_password
      TZ: Asia/Shanghai
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: sxdevops-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

volumes:
  mysql_data:
  redis_data:
